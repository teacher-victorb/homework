<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>Homework | CCLi English Lessons</title>

  <style>
    :root {
      --blue: #0b4f8a;
      --blue-dark: #083d6c;
      --blue-soft: #eaf4fb;
      --ink: #17212b;
      --muted: #64748b;
      --line: #d7e2ec;
      --paper: #ffffff;
      --page: #f4f7fa;
      --shadow: 0 12px 32px rgba(19, 46, 73, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    .topbar {
      background: linear-gradient(135deg, var(--blue-dark), var(--blue));
      color: #fff;
      padding: 36px 20px 32px;
    }

    .topbar-inner,
    main {
      width: min(980px, calc(100% - 32px));
      margin: 0 auto;
    }

    .eyebrow {
      margin: 0 0 6px;
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: .12em;
      font-weight: 800;
      opacity: .85;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.1rem, 5vw, 3.25rem);
      line-height: 1.05;
      letter-spacing: -.035em;
    }

    .subtitle {
      margin: 11px 0 0;
      color: rgba(255,255,255,.9);
      max-width: 720px;
    }

    main { padding: 28px 0 54px; }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px;
    }

    .search-wrap { position: relative; }

    .search-wrap input {
      width: 100%;
      border: 1.5px solid #b8c8d8;
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      padding: 12px 14px 12px 42px;
      outline: none;
      box-shadow: var(--shadow);
    }

    .search-wrap input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(11,79,138,.12), var(--shadow);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    .count {
      background: var(--blue-soft);
      color: var(--blue-dark);
      border: 1px solid #c9dceb;
      border-radius: 999px;
      padding: 9px 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .status,
    .empty {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px;
      text-align: center;
      color: var(--muted);
      box-shadow: var(--shadow);
    }

    .homework-list {
      display: grid;
      gap: 14px;
    }

    .homework-card {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 17px 18px;
      box-shadow: var(--shadow);
      text-decoration: none;
      color: inherit;
      transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
    }

    .homework-card:hover {
      transform: translateY(-2px);
      border-color: #9fbfd8;
      box-shadow: 0 16px 36px rgba(19, 46, 73, 0.12);
    }

    .icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: var(--blue-soft);
      color: var(--blue-dark);
      font-size: 1.25rem;
      font-weight: 900;
    }

    .meta { min-width: 0; }

    .title {
      margin: 0;
      color: var(--blue-dark);
      font-size: 1.06rem;
      font-weight: 850;
      line-height: 1.25;
    }

    .filename {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: .82rem;
      overflow-wrap: anywhere;
    }

    .open {
      color: var(--blue);
      font-weight: 850;
      white-space: nowrap;
    }

    .footer {
      text-align: center;
      padding: 28px 16px 36px;
      color: #7b8794;
      font-size: .8rem;
    }

    @media (max-width: 650px) {
      .toolbar { grid-template-columns: 1fr; }
      .count { justify-self: start; }

      .homework-card {
        grid-template-columns: 46px minmax(0, 1fr);
        gap: 12px;
        padding: 15px;
      }

      .icon {
        width: 46px;
        height: 46px;
      }

      .open {
        grid-column: 2;
        margin-top: -4px;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="topbar-inner">
      <p class="eyebrow">CCLi English Lessons</p>
      <h1>Homework</h1>
      <p class="subtitle">
        Choose your homework below. New HTML activities added to this repository are listed automatically.
      </p>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input id="search" type="search" placeholder="Search homework..." autocomplete="off" />
      </div>

      <div class="count" id="count">Loading…</div>
    </div>

    <div id="status" class="status">Loading homework…</div>
    <div id="list" class="homework-list" hidden></div>
    <div id="empty" class="empty" hidden>No homework found.</div>
  </main>

  <div class="footer">CCLi · Interactive Homework</div>

  <script>
    /*
      CORRECT CONFIGURATION FOR:

      GitHub repository:
      https://github.com/teacher-victorb/homework

      GitHub Pages:
      https://teacher-victorb.github.io/homework/

      IMPORTANT:
      The homework files are in the ROOT of the "homework" repository.
      Therefore, the API must read the repository root — not a /homework/
      folder inside another repository.
    */

    const OWNER = "teacher-victorb";
    const REPO = "homework";
    const BRANCH = "main";

    const listEl = document.getElementById("list");
    const statusEl = document.getElementById("status");
    const emptyEl = document.getElementById("empty");
    const countEl = document.getElementById("count");
    const searchEl = document.getElementById("search");

    let allHomework = [];

    function prettyName(filename) {
      return filename
        .replace(/\.html?$/i, "")
        .replace(/[_-]+/g, " ")
        .replace(/\s+/g, " ")
        .trim()
        .replace(/\b\w/g, letter => letter.toUpperCase());
    }

    function isHomeworkFile(item) {
      return (
        item &&
        item.type === "file" &&
        /\.html?$/i.test(item.name) &&
        !/^index\.html?$/i.test(item.name)
      );
    }

    async function getHomeworkTitle(file) {
      const fallback = prettyName(file.name);

      try {
        const response = await fetch(file.download_url, { cache: "no-store" });

        if (!response.ok) return fallback;

        const source = await response.text();

        // Optional custom title:
        // <meta name="homework-title" content="Corporate Well-Being">
        const customTitle = source.match(
          /<meta\s+name=["']homework-title["']\s+content=["']([^"']+)["'][^>]*>/i
        );

        if (customTitle && customTitle[1].trim()) {
          return customTitle[1].trim();
        }

        const titleTag = source.match(/<title[^>]*>([\s\S]*?)<\/title>/i);

        if (titleTag) {
          const decoder = document.createElement("textarea");
          decoder.innerHTML = titleTag[1].replace(/\s+/g, " ").trim();

          const title = decoder.value.trim();
          if (title) return title;
        }

      } catch (error) {
        console.warn("Could not read title for:", file.name, error);
      }

      return fallback;
    }

    function render() {
      const query = searchEl.value.trim().toLowerCase();

      const filtered = allHomework.filter(item => {
        const searchable = `${item.title} ${item.name}`.toLowerCase();
        return searchable.includes(query);
      });

      listEl.innerHTML = "";

      filtered.forEach((item, index) => {
        const card = document.createElement("a");
        card.className = "homework-card";

        // Since index.html and homework files are in the same repository root,
        // a relative link is enough.
        card.href = "./" + encodeURIComponent(item.name);

        const number = document.createElement("div");
        number.className = "icon";
        number.textContent = index + 1;

        const meta = document.createElement("div");
        meta.className = "meta";

        const title = document.createElement("h2");
        title.className = "title";
        title.textContent = item.title;

        const filename = document.createElement("p");
        filename.className = "filename";
        filename.textContent = item.name;

        meta.append(title, filename);

        const open = document.createElement("div");
        open.className = "open";
        open.textContent = "Open →";

        card.append(number, meta, open);
        listEl.appendChild(card);
      });

      const total = allHomework.length;
      countEl.textContent = `${total} homework${total === 1 ? "" : "s"}`;

      listEl.hidden = filtered.length === 0;
      emptyEl.hidden = filtered.length !== 0;
    }

    async function loadHomework() {
      // Correct API endpoint: ROOT of teacher-victorb/homework
      const apiUrl =
        `https://api.github.com/repos/${OWNER}/${REPO}/contents?ref=${encodeURIComponent(BRANCH)}`;

      try {
        const response = await fetch(apiUrl, {
          headers: {
            "Accept": "application/vnd.github+json"
          },
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(`GitHub API returned HTTP ${response.status}`);
        }

        const data = await response.json();

        if (!Array.isArray(data)) {
          throw new Error("GitHub did not return the repository file list.");
        }

        const files = data
          .filter(isHomeworkFile)
          .sort((a, b) =>
            a.name.localeCompare(b.name, undefined, {
              numeric: true,
              sensitivity: "base"
            })
          );

        allHomework = await Promise.all(
          files.map(async file => ({
            name: file.name,
            title: await getHomeworkTitle(file)
          }))
        );

        statusEl.hidden = true;
        render();

      } catch (error) {
        console.error(error);

        countEl.textContent = "Unavailable";
        listEl.hidden = true;
        emptyEl.hidden = true;
        statusEl.hidden = false;

        statusEl.innerHTML =
          "<strong>Could not load the homework list.</strong><br>" +
          "The page could not read the files from the " +
          "<code>teacher-victorb/homework</code> repository.";
      }
    }

    searchEl.addEventListener("input", render);

    loadHomework();
  </script>
</body>
</html>
